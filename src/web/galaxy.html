<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>小瑜记忆星系 · 3D</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0a1a; color: #e0e0f0; font-family: -apple-system, "PingFang SC", sans-serif; overflow: hidden; }
  #canvas { display: block; cursor: grab; }
  #canvas:active { cursor: grabbing; }
  #panel {
    position: fixed; top: 16px; left: 16px; width: 320px;
    background: rgba(20, 20, 40, 0.9); border: 1px solid #3a3a6a;
    border-radius: 8px; padding: 16px; backdrop-filter: blur(8px);
    max-height: calc(100vh - 32px); overflow-y: auto;
  }
  #panel h2 { font-size: 16px; margin-bottom: 12px; color: #8ab4ff; }
  #panel .stats { font-size: 12px; color: #888; margin-bottom: 12px; }
  #panel .detail { font-size: 13px; line-height: 1.6; }
  #panel .detail h3 { font-size: 14px; color: #ffd8a8; margin-bottom: 8px; }
  #panel .detail .row { margin: 4px 0; }
  #panel .detail .label { color: #888; }
  #filters { margin-top: 12px; padding-top: 12px; border-top: 1px solid #3a3a6a; }
  #filters label { display: block; font-size: 12px; margin: 4px 0; cursor: pointer; }
  #filters input { margin-right: 6px; }
  #hint { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #666; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="panel">
  <h2>🌊 小瑜记忆星系 · 3D</h2>
  <div class="stats" id="stats">加载中...</div>
  <div class="detail" id="detail">
    <p style="color:#666">点击星球查看记忆详情</p>
  </div>
  <div id="filters"></div>
</div>
<div id="hint">拖拽旋转 · 滚轮缩放 · 点击节点查看详情</div>

<script src="./galaxy-data.js"></script>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let data = { nodes: [], edges: [] };
let filtered = [];
let selected = null;
let cam = { zoom: 1 };
let rot = { x: 0.35, y: 0 };
let dragging = false;
let dragStart = { x: 0, y: 0, rotX: 0, rotY: 0 };
let lastMove = { x: 0, y: 0 };
let nodes = [];
const FOV = 600;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// 由 id 生成确定性 3D 坐标（球面上均匀分布，重开页面位置不变）
function hashId(id) {
  let h = 0;
  for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
  return h;
}
function spherePoint(id, i) {
  const h = hashId(id) || (i + 1);
  const u = ((h % 1000) / 1000) * Math.PI * 2;
  const v = (((h >> 3) % 1000) / 1000) * Math.PI;
  const R = 170 + (h % 60);
  return {
    x: R * Math.sin(v) * Math.cos(u),
    y: R * Math.cos(v),
    z: R * Math.sin(v) * Math.sin(u),
  };
}

async function loadData() {
  if (window.XIAOYU_GALAXY && Array.isArray(window.XIAOYU_GALAXY.nodes) && window.XIAOYU_GALAXY.nodes.length) {
    data = window.XIAOYU_GALAXY;
  }
  if (!data.nodes.length) {
    for (const url of ['galaxy-data.json']) {
      try {
        const r = await fetch(url, { cache: 'no-store' });
        if (r.ok) { data = await r.json(); break; }
      } catch {}
    }
  }
  if (!data.nodes.length) {
    document.getElementById('stats').innerHTML =
      '未找到 galaxy-data.js<br><span style="color:#c88">先运行 node src/engine/build-galaxy.js 导出，再刷新本页</span>';
    data = {
      nodes: [
        { id: 'demo1', title: '主人喜欢奶茶三分糖', summary: '偏好记录', type: 'preference', mood: '开心', valence: 0.6, salience: 0.8, access_count: 5, last_access: Date.now(), created_at: Date.now()-86400000*7, source: 'demo', tags: ['preference'], pinned: true, brightness: 0.9 },
        { id: 'demo2', title: '小瑜是鲸鱼娘', summary: '身份', type: 'identity', mood: '平静', valence: 0.3, salience: 0.95, access_count: 20, last_access: Date.now(), created_at: Date.now()-86400000*30, source: 'demo', tags: ['identity','persona'], pinned: true, brightness: 1 },
        { id: 'demo3', title: '约定周末散步', summary: '约定', type: 'promise', mood: '期待', valence: 0.7, salience: 0.6, access_count: 2, last_access: Date.now()-86400000*2, created_at: Date.now()-86400000*5, source: 'demo', tags: ['promise'], pinned: false, brightness: 0.5 },
      ],
      edges: [
        { src: 'demo1', dst: 'demo3', rel: 'semantic', weight: 0.6 },
        { src: 'demo2', dst: 'demo1', rel: 'emotion', weight: 0.4 },
      ]
    };
  }
  layoutNodes();
  buildFilters();
  updateStats();
  requestAnimationFrame(tick);
}

function layoutNodes() {
  nodes = data.nodes.map((node, i) => {
    const p = spherePoint(node.id, i);
    return { ...node, ...p, proj: null };
  });
}

function buildFilters() {
  const types = [...new Set(data.nodes.map(n => n.type))];
  const box = document.getElementById('filters');
  box.innerHTML = '<strong style="font-size:12px">过滤</strong>';
  types.forEach(t => {
    const label = document.createElement('label');
    label.innerHTML = `<input type="checkbox" checked value="${t}" onchange="applyFilter()"> ${t}`;
    box.appendChild(label);
  });
}

function applyFilter() {
  const checked = [...document.querySelectorAll('#filters input:checked')].map(i => i.value);
  filtered = nodes.filter(n => checked.includes(n.type));
}

function updateStats() {
  const d = new Date(data.generated_at || Date.now());
  document.getElementById('stats').textContent =
    `节点 ${data.nodes.length} · 边 ${data.edges.length} · 生成于 ${d.toLocaleString('zh-CN')}`;
}

// 3D 旋转 + 透视投影
function project(n) {
  const cy = Math.cos(rot.y), sy = Math.sin(rot.y);
  const cx = Math.cos(rot.x), sx = Math.sin(rot.x);
  // 绕 Y
  let x = n.x * cy + n.z * sy;
  let z = -n.x * sy + n.z * cy;
  // 绕 X
  let y = n.y * cx - z * sx;
  z = n.y * sx + z * cx;
  const scale = FOV / (FOV - z);
  const cw = canvas.width / 2, ch = canvas.height / 2;
  return {
    sx: cw + x * scale * cam.zoom,
    sy: ch + y * scale * cam.zoom,
    depth: z,
    scale,
  };
}

function render() {
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const visible = filtered.length ? filtered : nodes;
  for (const n of visible) n.proj = project(n);

  // 边
  ctx.lineWidth = 1;
  const byId = new Map(visible.map(n => [n.id, n]));
  for (const e of data.edges) {
    const a = byId.get(e.src), b = byId.get(e.dst);
    if (a && b && a.proj && b.proj) {
      const depthAlpha = 0.12 + 0.18 * ((a.proj.depth + b.proj.depth) / 400 + 0.5);
      ctx.strokeStyle = `rgba(100, 150, 255, ${Math.max(0.05, Math.min(0.35, depthAlpha))})`;
      ctx.beginPath();
      ctx.moveTo(a.proj.sx, a.proj.sy);
      ctx.lineTo(b.proj.sx, b.proj.sy);
      ctx.stroke();
    }
  }

  // 节点（按深度排序，远处先画）
  const sorted = [...visible].sort((a, b) => (a.proj?.depth || 0) - (b.proj?.depth || 0));
  for (const n of sorted) {
    if (!n.proj) continue;
    const depthScale = 1 + n.proj.depth / 600;
    const r = Math.max(2, (4 + n.brightness * 10) * n.proj.scale * depthScale);
    const color = n.valence > 0.3 ? '100, 200, 255' : n.valence < -0.3 ? '255, 150, 150' : '180, 180, 255';
    const grad = ctx.createRadialGradient(n.proj.sx, n.proj.sy, 0, n.proj.sx, n.proj.sy, r * 2);
    grad.addColorStop(0, `rgba(${color}, ${n.brightness})`);
    grad.addColorStop(1, `rgba(${color}, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(n.proj.sx, n.proj.sy, r * 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = `rgba(255, 255, 255, ${0.4 + n.brightness * 0.6})`;
    ctx.beginPath();
    ctx.arc(n.proj.sx, n.proj.sy, r, 0, Math.PI * 2);
    ctx.fill();

    if (n.pinned) {
      ctx.strokeStyle = '#ffd8a8';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(n.proj.sx, n.proj.sy, r + 3, 0, Math.PI * 2);
      ctx.stroke();
    }

    if (r > 6) {
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.font = '11px sans-serif';
      ctx.fillText(n.title.slice(0, 12), n.proj.sx + r + 4, n.proj.sy + 4);
    }
  }
}

let autoRotate = true;
function tick() {
  if (!dragging && autoRotate) rot.y += 0.003;
  render();
  requestAnimationFrame(tick);
}

// 交互
canvas.addEventListener('mousedown', (e) => {
  dragging = true;
  autoRotate = false;
  dragStart = { x: e.clientX, y: e.clientY, rotX: rot.x, rotY: rot.y };
  lastMove = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener('mousemove', (e) => {
  if (dragging) {
    rot.y = dragStart.rotY + (e.clientX - dragStart.x) * 0.008;
    rot.x = Math.max(-1.2, Math.min(1.2, dragStart.rotX + (e.clientY - dragStart.y) * 0.008));
    lastMove = { x: e.clientX, y: e.clientY };
  } else {
    const hover = hitTest(e.clientX, e.clientY);
    canvas.style.cursor = hover ? 'pointer' : 'grab';
  }
});
window.addEventListener('mouseup', (e) => {
  if (!dragging) return;
  dragging = false;
  const moved = Math.abs(e.clientX - dragStart.x) + Math.abs(e.clientY - dragStart.y);
  if (moved < 4) {
    const hit = hitTest(e.clientX, e.clientY);
    if (hit) { selected = hit; showDetail(hit); }
  }
  setTimeout(() => { autoRotate = true; }, 3000);
});
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 0.9 : 1.1;
  cam.zoom = Math.max(0.3, Math.min(3, cam.zoom * factor));
}, { passive: false });

function hitTest(mx, my) {
  const visible = filtered.length ? filtered : nodes;
  let hit = null;
  for (const n of visible) {
    if (!n.proj) continue;
    const dx = mx - n.proj.sx, dy = my - n.proj.sy;
    const r = Math.max(6, (4 + n.brightness * 10) * n.proj.scale);
    if (dx * dx + dy * dy < r * r) hit = n;
  }
  return hit;
}

function showDetail(n) {
  const d = new Date(n.last_access || n.created_at || Date.now());
  document.getElementById('detail').innerHTML = `
    <h3>${n.title}</h3>
    <div class="row"><span class="label">摘要：</span>${n.summary || '—'}</div>
    <div class="row"><span class="label">类型：</span>${n.type}</div>
    <div class="row"><span class="label">情绪：</span>${n.mood || '—'} (效价 ${(n.valence ?? 0).toFixed(2)})</div>
    <div class="row"><span class="label">重要度：</span>${(n.salience ?? 0).toFixed(2)}</div>
    <div class="row"><span class="label">调用次数：</span>${n.access_count || 0}</div>
    <div class="row"><span class="label">最近访问：</span>${d.toLocaleString('zh-CN')}</div>
    <div class="row"><span class="label">来源：</span>${n.source || '—'}</div>
    <div class="row"><span class="label">标签：</span>${(n.tags || []).join(', ') || '—'}</div>
    ${n.pinned ? '<div class="row" style="color:#ffd8a8">★ 核心保护记忆</div>' : ''}
  `;
}

loadData();
</script>
</body>
</html>
